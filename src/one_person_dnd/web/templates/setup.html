{% extends "base.html" %}

{% block title %}配置 - one_person_dnd{% endblock %}

{% block content %}
  <h1>配置 LLM</h1>
  <div class="muted">配置文件：api_config.ini</div>

  <form id="setup-form" class="form" method="post" action="/setup">
    <label class="label">
      Base URL
      <input class="input" name="base_url" required value="{{ existing.base_url if existing else '' }}" placeholder="http://host:port/v1（不要填 /chat/completions）" />
    </label>

    <label class="label">
      API Key
      <input class="input" name="api_key" value="{{ existing.api_key if existing else '' }}" placeholder="sk-...（本地 OpenAI-compatible 可留空）" />
    </label>

    <label class="label">
      Model
      <input class="input" name="model" required value="{{ existing.model if existing else '' }}" placeholder="gpt-4o-mini / deepseek-chat / ..." />
    </label>

    <label class="label">
      Timeout Seconds
      <input class="input" name="timeout_seconds" type="number" step="0.1" min="1" value="{{ existing.timeout_seconds if existing else 60.0 }}" />
    </label>

    <details class="advanced" open>
      <summary>采样参数（可选）</summary>
      <label class="label">
        Temperature（可选）
        <input
          class="input"
          name="temperature"
          type="number"
          step="0.01"
          min="0"
          max="2"
          value="{{ existing.temperature if existing and existing.temperature is not none else '' }}"
          placeholder="例如：0.7"
        />
      </label>

      <label class="label">
        Top P（可选）
        <input
          class="input"
          name="top_p"
          type="number"
          step="0.01"
          min="0"
          max="1"
          value="{{ existing.top_p if existing and existing.top_p is not none else '' }}"
          placeholder="例如：0.9"
        />
      </label>

      <label class="label">
        Max Tokens（可选）
        <input
          class="input"
          name="max_tokens"
          type="number"
          step="1"
          min="1"
          value="{{ existing.max_tokens if existing and existing.max_tokens is not none else '' }}"
          placeholder="例如：800"
        />
      </label>
    </details>

    <div class="row">
      <button class="btn" type="submit">保存</button>
      <button
        class="btn btn--ghost"
        type="button"
        hx-post="/setup/test"
        hx-target="#test-result"
        hx-include="#setup-form"
      >
        测试连接
      </button>
      <a class="btn btn--ghost" href="/">返回</a>
    </div>

    <div id="test-result" class="test-result"></div>
  </form>
{% endblock %}
