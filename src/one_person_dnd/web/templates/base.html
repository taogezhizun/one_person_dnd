<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <meta
      name="htmx-config"
      content='{"selfRequestsOnly":true,"allowScriptTags":false,"allowEval":false}'
    />
    <title>{% block title %}one_person_dnd{% endblock %}</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23121a26'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' font-family='Arial' fill='%237aa2f7'%3Ed%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/style.css?v=20260728-turn-deck" />
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content" data-skip-link>跳到主要内容</a>
    <header class="header">
      <div class="container header__inner">
        <a class="brand" href="/" translate="no">one_person_dnd</a>
        {% set current_path = request.url.path if request is defined else "" %}
        <nav class="nav" aria-label="主要导航">
          <a href="/game" {% if current_path == "/game" %}aria-current="page"{% endif %}>游玩</a>
          <a href="/new" {% if current_path.startswith("/new") %}aria-current="page"{% endif %}>新冒险</a>
          <a href="/saves" {% if current_path.startswith("/saves") %}aria-current="page"{% endif %}>冒险</a>
          <a href="/memory/world" {% if current_path.startswith("/memory/world") %}aria-current="page"{% endif %}>世界</a>
          <a href="/threads" {% if current_path.startswith("/threads") %}aria-current="page"{% endif %}>剧情线</a>
          <a href="/models" {% if current_path.startswith("/models") %}aria-current="page"{% endif %}>模型</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="container app-main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <script id="dnd-labels" type="application/json">{{ label_maps_json | safe }}</script>
    <script src="/static/js/turn_stream_state.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
