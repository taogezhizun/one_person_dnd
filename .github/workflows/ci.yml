name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile
        run: |
          python -m compileall -q src/one_person_dnd

      - name: Check browser JavaScript
        run: |
          node --check src/one_person_dnd/web/static/js/app.js
          node --check src/one_person_dnd/web/static/js/turn_stream_state.js
          node --test tests/js/*.js

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test*.py"
